services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - '5432:5432'
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dash
      MYSQL_DATABASE: dash
      MYSQL_USER: dash
      MYSQL_PASSWORD: dash
    ports:
      - '3306:3306'
